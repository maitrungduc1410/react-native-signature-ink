<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>react-native-signature-ink</title>
  <defs>
    <linearGradient id="g" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399" />
      <stop offset="0.55" stop-color="#10B981" />
      <stop offset="1" stop-color="#0F766E" />
    </linearGradient>
  </defs>
  <!-- signing baseline -->
  <path d="M8 52h48" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.55" />
  <!-- ink signature: a looped stroke that tapers like the velocity-Bezier pen -->
  <path
    d="M7 41c5-1 9-9 11-17s1-13-3-11-4 15 0 25 9 3 11-4 2-10 5-6-1 13 3 12 6-10 9-9-1 9 3 8 7-4 11-5"
    stroke="url(#g)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- ink drop at the end of the stroke -->
  <circle cx="59" cy="34" r="3" fill="#0F766E" />
</svg>
